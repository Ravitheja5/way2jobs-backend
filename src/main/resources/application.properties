spring.application.name=way2jobs-backend

# ===================== DATABASE =====================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================== SERVER =====================

server.port=${PORT:8080}

# ===================== SCRAPER =====================

way2jobs.scraper.enabled=true
way2jobs.scraper.schedule-enabled=false
way2jobs.scraper.cron=0 0 6,18 * * *
way2jobs.scraper.max-jobs-per-run=200
way2jobs.scraper.polite-delay-ms=2500
way2jobs.scraper.timeout-ms=20000
way2jobs.scraper.skip-expired=true
way2jobs.scraper.notify-on-new-jobs=true
way2jobs.scraper.user-agent=Way2JobsBot/1.0

# Default category
way2jobs.scraper.default-category-name=State Government

# Fallback department
way2jobs.scraper.fallback-department-name=

# ===================== DEPARTMENT ALIASES =====================

way2jobs.scraper.department-aliases[MANUU]=Maulana Azad National Urdu University
way2jobs.scraper.department-aliases[APCOB]=Andhra Pradesh Cooperative Bank
way2jobs.scraper.department-aliases[AIIMS Mangalagiri]=AIIMS Mangalagiri
way2jobs.scraper.department-aliases[DSH Kadapa]=District Selection Committee Kadapa
way2jobs.scraper.department-aliases[ANGRAU]=Acharya N.G. Ranga Agricultural University
way2jobs.scraper.department-aliases[IREL]=Indian Rare Earths Limited
way2jobs.scraper.department-aliases[SVIMS Tirupati]=Sri Venkateswara Institute of Medical Sciences
way2jobs.scraper.department-aliases[SVIMS]=Sri Venkateswara Institute of Medical Sciences
way2jobs.scraper.department-aliases[Visakhapatnam Port Authority]=Visakhapatnam Port Authority

# ===================== SOURCES =====================

way2jobs.scraper.sources[AllIndia]=https://www.freejobalert.com/latest-notifications/
way2jobs.scraper.sources[AndhraPradesh]=https://www.freejobalert.com/ap-government-jobs/
way2jobs.scraper.sources[Telangana]=https://www.freejobalert.com/telangana-government-jobs/