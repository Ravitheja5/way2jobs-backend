spring.application.name=way2jobs-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}


# ===================== SCRAPER =====================
# Master switch. false అయితే app పూర్తిగా ఇప్పటిలాగే behave అవుతుంది.
way2jobs.scraper.enabled=true

# Auto-run on/off
way2jobs.scraper.schedule-enabled=true
# రోజుకి రెండుసార్లు — ఉదయం 6, సాయంత్రం 6 (IST)
way2jobs.scraper.cron=0 0 6,18 * * *

# ఒక run లో ఎక్కువలో ఎక్కువ ఎన్ని కొత్త jobs insert చేయాలి
way2jobs.scraper.max-jobs-per-run=200

# రెండు requests మధ్య gap (block అవ్వకుండా ఉండటానికి)
way2jobs.scraper.polite-delay-ms=2500
way2jobs.scraper.timeout-ms=20000

# missing State/Category/Department automatic గా create చేయాలా
way2jobs.scraper.auto-create-lookups=true
way2jobs.scraper.default-category=Other
way2jobs.scraper.default-state=All India

# last date దాటిపోయిన jobs skip చేయాలా
way2jobs.scraper.skip-expired=true

# కొత్త job కి Firebase push పంపాలా (default off)
way2jobs.scraper.notify-on-new-jobs=false

# Source pages — key = states table లో ఉన్న పేరు
way2jobs.scraper.sources.All India=https://www.freejobalert.com/latest-notifications/
way2jobs.scraper.sources.Andhra Pradesh=https://www.freejobalert.com/ap-government-jobs/
way2jobs.scraper.sources.Telangana=https://www.freejobalert.com/telangana-government-jobs/
